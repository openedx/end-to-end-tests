name: Run E2E suite
description: >
  Install dependencies, configure the suite for a target Open edX installation,
  run the Playwright test suite, and upload the standard set of reports. Shared
  by every workflow that runs the suite against a target — regardless of how
  that target was provisioned (ephemeral Tutor, externally supplied URL, etc.).

inputs:
  lms_base_url:
    description: 'LMS origin, e.g. http://local.openedx.io'
    required: true
  apps_base_url:
    description: 'MFE host origin, e.g. http://apps.local.openedx.io'
    required: true
  cms_base_url:
    description: 'Studio (CMS) origin. Optional — omit to skip Studio specs.'
    required: false
    default: ''
  org:
    description: 'Organization short code used when creating/locating content.'
    required: false
    default: ''
  course_key:
    description: 'Default course to target in course-completion specs.'
    required: false
    default: ''
  capabilities:
    description: 'Comma-separated capabilities enabled on the target (e.g. discussions,notes).'
    required: false
    default: ''
  admin_username:
    description: 'Optional admin/staff account username for staff-role coverage.'
    required: false
    default: ''
  admin_password:
    description: 'Password for admin_username. Pass via secrets in the caller.'
    required: false
    default: ''
  account_backend:
    description: 'ACCOUNT_BACKEND override: automatic (default) or manual.'
    required: false
    default: ''
  allow_cross_site_origins:
    description: 'Set true when LMS/Studio/MFE origins are not same-site.'
    required: false
    default: ''
  mail_provider:
    description: 'MAIL_PROVIDER: the mailbox the suite reads e-mail from (mailpit, openinbox). Empty = none; the email-inbox capability then cannot be declared.'
    required: false
    default: ''
  mail_provider_plugins:
    description: 'CUSTOM_MAIL_PROVIDER_PLUGINS: comma-separated plugin paths providing mail_provider (e.g. ./plugins/mailpit.plugin.ts).'
    required: false
    default: ''
  mailpit_base_url:
    description: 'MAILPIT_BASE_URL for the mailpit provider: the Mailpit API origin as the runner reaches it.'
    required: false
    default: ''
  openinbox_api_key:
    description: 'OPENINBOX_API_KEY for the openinbox provider. Pass via secrets in the caller.'
    required: false
    default: ''
  domains:
    description: 'Domains to run, space-separated (e.g. "lms studio"). Empty = all.'
    required: false
    default: ''
  features:
    description: 'Feature/capability tags to run, space-separated (e.g. "@smoke @discussions"). Empty = all.'
    required: false
    default: ''
  exclude_features:
    description: 'Feature/tags to exclude, space-separated (e.g. "@unit"). Mapped to --grep-invert. Empty = exclude nothing.'
    required: false
    default: ''
  artifact_suffix:
    description: 'Suffix distinguishing this run''s uploaded artifacts from other callers (e.g. release or environment name).'
    required: true
  btr_release:
    description: 'Open edX release the target runs (main, verawood, …). Recorded in the BTR run report; required when btr_sheet_url is set.'
    required: false
    default: ''
  btr_test_ref:
    description: 'Git ref of this repo that was checked out, when it differs from the workflow''s branch. Recorded in the BTR run report.'
    required: false
    default: ''
  btr_sheet_url:
    description: 'Google Sheets URL of the per-release BTR results spreadsheet. Empty = do not publish.'
    required: false
    default: ''
  btr_update_latest:
    description: 'Whether this run may overwrite the sheet''s "Latest" tab (true for an unfiltered run of the default branch).'
    required: false
    default: 'true'
  btr_environment:
    description: 'GitHub Environment name for external-target runs; shown as the sheet''s Target and in the run tab title.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate admin credential inputs
      shell: bash
      env:
        ADMIN_USERNAME: ${{ inputs.admin_username }}
        ADMIN_PASSWORD: ${{ inputs.admin_password }}
      run: |
        set -euo pipefail
        if [ -n "$ADMIN_USERNAME" ] && [ -z "$ADMIN_PASSWORD" ]; then
          echo "::error::admin_username is set but admin_password is empty. Set both or neither."
          exit 1
        fi
        if [ -z "$ADMIN_USERNAME" ] && [ -n "$ADMIN_PASSWORD" ]; then
          echo "::error::admin_password is set but admin_username is empty. Set both or neither."
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Get installed Playwright version
      id: playwright_version
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browser binaries
      id: playwright_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}

    - name: Install Playwright browsers (cache miss)
      if: steps.playwright_cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    # Browser binaries were restored from cache, but OS-level shared
    # libraries (apt packages) live outside ~/.cache/ms-playwright and
    # are not covered by the cache above.
    - name: Install Playwright OS dependencies (cache hit)
      if: steps.playwright_cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium

    - name: Write suite configuration (.env)
      shell: bash
      env:
        LMS_BASE_URL: ${{ inputs.lms_base_url }}
        APPS_BASE_URL: ${{ inputs.apps_base_url }}
        CMS_BASE_URL: ${{ inputs.cms_base_url }}
        ORG: ${{ inputs.org }}
        COURSE_KEY: ${{ inputs.course_key }}
        CAPABILITIES: ${{ inputs.capabilities }}
        ACCOUNT_BACKEND: ${{ inputs.account_backend }}
        ALLOW_CROSS_SITE_ORIGINS: ${{ inputs.allow_cross_site_origins }}
        MAIL_PROVIDER: ${{ inputs.mail_provider }}
        CUSTOM_MAIL_PROVIDER_PLUGINS: ${{ inputs.mail_provider_plugins }}
        MAILPIT_BASE_URL: ${{ inputs.mailpit_base_url }}
      run: |
        set -euo pipefail
        : > .env
        echo "LMS_BASE_URL=${LMS_BASE_URL}" >> .env
        echo "APPS_BASE_URL=${APPS_BASE_URL}" >> .env
        [ -n "$CMS_BASE_URL" ] && echo "CMS_BASE_URL=${CMS_BASE_URL}" >> .env
        [ -n "$ORG" ] && echo "ORG=${ORG}" >> .env
        [ -n "$COURSE_KEY" ] && echo "COURSE_KEY=${COURSE_KEY}" >> .env
        [ -n "$CAPABILITIES" ] && echo "CAPABILITIES=${CAPABILITIES}" >> .env
        [ -n "$ACCOUNT_BACKEND" ] && echo "ACCOUNT_BACKEND=${ACCOUNT_BACKEND}" >> .env
        [ -n "$ALLOW_CROSS_SITE_ORIGINS" ] && echo "ALLOW_CROSS_SITE_ORIGINS=${ALLOW_CROSS_SITE_ORIGINS}" >> .env
        [ -n "$MAIL_PROVIDER" ] && echo "MAIL_PROVIDER=${MAIL_PROVIDER}" >> .env
        [ -n "$CUSTOM_MAIL_PROVIDER_PLUGINS" ] && echo "CUSTOM_MAIL_PROVIDER_PLUGINS=${CUSTOM_MAIL_PROVIDER_PLUGINS}" >> .env
        [ -n "$MAILPIT_BASE_URL" ] && echo "MAILPIT_BASE_URL=${MAILPIT_BASE_URL}" >> .env
        echo "Wrote .env:"
        cat .env

    # ADMIN_USERNAME/ADMIN_PASSWORD are intentionally NOT written to .env:
    # dotenv treats an unquoted "#" as the start of a comment (and no quoting
    # scheme is fully transparent for arbitrary secret bytes), so a password
    # containing "#" would be silently truncated. Passing them as real
    # process env vars below avoids any file-parsing/escaping concerns.
    # BTR_RELEASE / BTR_TEST_REF feed the btr-run reporter's run metadata
    # (src/reporting/btr-run-reporter.ts); DOMAINS doubles as its path filter.
    - name: Run tests
      shell: bash
      env:
        DOMAINS: ${{ inputs.domains }}
        FEATURES: ${{ inputs.features }}
        EXCLUDE_FEATURES: ${{ inputs.exclude_features }}
        ADMIN_USERNAME: ${{ inputs.admin_username }}
        ADMIN_PASSWORD: ${{ inputs.admin_password }}
        # A secret, so a process env var rather than a .env line (see above).
        OPENINBOX_API_KEY: ${{ inputs.openinbox_api_key }}
        BTR_RELEASE: ${{ inputs.btr_release }}
        BTR_TEST_REF: ${{ inputs.btr_test_ref }}
      run: |
        set -euo pipefail
        args=()
        if [ -n "${DOMAINS// /}" ]; then
          for d in $DOMAINS; do args+=("tests/$d"); done
        fi
        grep_expr=""
        if [ -n "${FEATURES// /}" ]; then
          grep_expr="$(echo "$FEATURES" | xargs | tr ' ' '|')"
        fi
        grep_invert_expr=""
        if [ -n "${EXCLUDE_FEATURES// /}" ]; then
          grep_invert_expr="$(echo "$EXCLUDE_FEATURES" | xargs | tr ' ' '|')"
        fi
        cmd=(npx playwright test)
        if [ ${#args[@]} -gt 0 ]; then cmd+=("${args[@]}"); fi
        if [ -n "$grep_expr" ]; then cmd+=(--grep "$grep_expr"); fi
        if [ -n "$grep_invert_expr" ]; then cmd+=(--grep-invert "$grep_invert_expr"); fi
        echo "Running: ${cmd[*]}"
        "${cmd[@]}"

    - name: Suite reports to job summary
      if: ${{ !cancelled() }}
      shell: bash
      run: node scripts/job-summary.mjs

    # Opt-in: only when the caller resolved a sheet for this release (see the
    # "Resolve BTR results sheet" step in the workflows). Its failure is visible
    # on this step alone; the test outcome above is unaffected. A failed publish
    # can be redone from the suite-reports artifact's btr-run.json.
    #
    # Credentials are never an input: the publisher reads BTR_SHEET_CREDENTIALS
    # from the environment, which the calling workflow sets from the repository
    # or Environment secret of that name. Unset = warn and skip the publish.
    - name: Publish BTR results to Google Sheet
      if: ${{ !cancelled() && inputs.btr_sheet_url != '' }}
      shell: bash
      env:
        BTR_SHEET_URL: ${{ inputs.btr_sheet_url }}
        BTR_RELEASE: ${{ inputs.btr_release }}
        BTR_UPDATE_LATEST: ${{ inputs.btr_update_latest }}
        BTR_ENVIRONMENT: ${{ inputs.btr_environment }}
      run: |
        set -euo pipefail
        if [ -z "$BTR_RELEASE" ]; then
          echo "::error::btr_sheet_url is set but btr_release is empty; the publisher needs the release to pick the sheet's identity."
          exit 1
        fi
        node scripts/publish-btr-sheet.mts \
          --release "$BTR_RELEASE" \
          --sheet "$BTR_SHEET_URL" \
          --update-latest "${BTR_UPDATE_LATEST:-true}" \
          --environment "$BTR_ENVIRONMENT"

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report-${{ inputs.artifact_suffix }}
        path: |
          playwright-report/
          test-results/
        retention-days: 14
        if-no-files-found: ignore

    # Upload BTR and A11y artifacts. Uploaded even when tests fail. btr-run.json
    # is the input to the results-sheet publisher, so a failed publish can be
    # redone from the artifact.
    - name: Upload suite reports (a11y backlog + BTR coverage + BTR run detail + timings)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: suite-reports-${{ inputs.artifact_suffix }}
        path: |
          test-results/a11y-violations.json
          test-results/btr-coverage.json
          test-results/btr-run.json
          test-results/timings-tests.csv
          test-results/timings-steps.csv
        retention-days: 30
        if-no-files-found: warn
