name: Run E2E suite
description: >
  Install dependencies, configure the suite for a target Open edX installation,
  run the Playwright test suite (or one shard of it), and upload the run's blob
  report. Shared by every workflow that runs the suite against a target —
  regardless of how that target was provisioned (ephemeral Tutor, externally
  supplied URL, etc.). The `report-suite` action turns one or more blob reports
  into the HTML report, the suite's report files, the job summary and the BTR
  sheet publish.

inputs:
  lms_base_url:
    description: 'LMS origin, e.g. http://local.openedx.io'
    required: true
  apps_base_url:
    description: 'MFE host origin, e.g. http://apps.local.openedx.io'
    required: true
  cms_base_url:
    description: 'Studio (CMS) origin. Optional — omit to skip Studio specs.'
    required: false
    default: ''
  org:
    description: 'Organization short code used when creating/locating content.'
    required: false
    default: ''
  course_key:
    description: 'Default course to target in course-completion specs.'
    required: false
    default: ''
  capabilities:
    description: 'Comma-separated capabilities enabled on the target (e.g. discussions,notes).'
    required: false
    default: ''
  admin_username:
    description: 'Optional admin/staff account username for staff-role coverage.'
    required: false
    default: ''
  admin_password:
    description: 'Password for admin_username. Pass via secrets in the caller.'
    required: false
    default: ''
  account_backend:
    description: 'ACCOUNT_BACKEND override: automatic (default) or manual.'
    required: false
    default: ''
  allow_cross_site_origins:
    description: 'Set true when LMS/Studio/MFE origins are not same-site.'
    required: false
    default: ''
  mail_provider:
    description: 'MAIL_PROVIDER: the mailbox the suite reads e-mail from (mailpit, openinbox). Empty = none; the email-inbox capability then cannot be declared.'
    required: false
    default: ''
  mail_provider_plugins:
    description: 'CUSTOM_MAIL_PROVIDER_PLUGINS: comma-separated plugin paths providing mail_provider (e.g. ./plugins/mailpit.plugin.ts).'
    required: false
    default: ''
  mailpit_base_url:
    description: 'MAILPIT_BASE_URL for the mailpit provider: the Mailpit API origin as the runner reaches it.'
    required: false
    default: ''
  openinbox_api_key:
    description: 'OPENINBOX_API_KEY for the openinbox provider. Pass via secrets in the caller.'
    required: false
    default: ''
  domains:
    description: 'Domains to run, space-separated (e.g. "lms studio"). Empty = all.'
    required: false
    default: ''
  features:
    description: 'Feature/capability tags to run, space-separated (e.g. "@smoke @discussions"). Empty = all.'
    required: false
    default: ''
  exclude_features:
    description: 'Feature/tags to exclude, space-separated (e.g. "@unit"). Mapped to --grep-invert. Empty = exclude nothing.'
    required: false
    default: ''
  shard:
    description: 'Playwright shard to run, as "<index>/<total>" (e.g. 2/4). Empty = the whole selection.'
    required: false
    default: ''
  profile:
    description: 'CI_PROFILE: the CI profile (a key of .ci/profiles.json) this job runs, recorded on every result so a merged report can tell profiles apart. Empty = none.'
    required: false
    default: ''
  run_id_suffix:
    description: 'RUN_ID_SUFFIX: up to three lowercase letters/digits appended to the run id, unique per shard of a run (e.g. d2).'
    required: false
    default: ''
  artifact_suffix:
    description: 'Suffix distinguishing this run''s blob-report artifact from other callers and shards (e.g. verawood-default-2).'
    required: true

runs:
  using: composite
  steps:
    - name: Validate admin credential inputs
      shell: bash
      env:
        ADMIN_USERNAME: ${{ inputs.admin_username }}
        ADMIN_PASSWORD: ${{ inputs.admin_password }}
      run: |
        set -euo pipefail
        if [ -n "$ADMIN_USERNAME" ] && [ -z "$ADMIN_PASSWORD" ]; then
          echo "::error::admin_username is set but admin_password is empty. Set both or neither."
          exit 1
        fi
        if [ -z "$ADMIN_USERNAME" ] && [ -n "$ADMIN_PASSWORD" ]; then
          echo "::error::admin_password is set but admin_username is empty. Set both or neither."
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Get installed Playwright version
      id: playwright_version
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browser binaries
      id: playwright_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}

    - name: Install Playwright browsers (cache miss)
      if: steps.playwright_cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    # Browser binaries were restored from cache, but OS-level shared
    # libraries (apt packages) live outside ~/.cache/ms-playwright and
    # are not covered by the cache above.
    - name: Install Playwright OS dependencies (cache hit)
      if: steps.playwright_cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium

    - name: Write suite configuration (.env)
      shell: bash
      env:
        LMS_BASE_URL: ${{ inputs.lms_base_url }}
        APPS_BASE_URL: ${{ inputs.apps_base_url }}
        CMS_BASE_URL: ${{ inputs.cms_base_url }}
        ORG: ${{ inputs.org }}
        COURSE_KEY: ${{ inputs.course_key }}
        CAPABILITIES: ${{ inputs.capabilities }}
        ACCOUNT_BACKEND: ${{ inputs.account_backend }}
        ALLOW_CROSS_SITE_ORIGINS: ${{ inputs.allow_cross_site_origins }}
        MAIL_PROVIDER: ${{ inputs.mail_provider }}
        CUSTOM_MAIL_PROVIDER_PLUGINS: ${{ inputs.mail_provider_plugins }}
        MAILPIT_BASE_URL: ${{ inputs.mailpit_base_url }}
      run: |
        set -euo pipefail
        : > .env
        echo "LMS_BASE_URL=${LMS_BASE_URL}" >> .env
        echo "APPS_BASE_URL=${APPS_BASE_URL}" >> .env
        [ -n "$CMS_BASE_URL" ] && echo "CMS_BASE_URL=${CMS_BASE_URL}" >> .env
        [ -n "$ORG" ] && echo "ORG=${ORG}" >> .env
        [ -n "$COURSE_KEY" ] && echo "COURSE_KEY=${COURSE_KEY}" >> .env
        [ -n "$CAPABILITIES" ] && echo "CAPABILITIES=${CAPABILITIES}" >> .env
        [ -n "$ACCOUNT_BACKEND" ] && echo "ACCOUNT_BACKEND=${ACCOUNT_BACKEND}" >> .env
        [ -n "$ALLOW_CROSS_SITE_ORIGINS" ] && echo "ALLOW_CROSS_SITE_ORIGINS=${ALLOW_CROSS_SITE_ORIGINS}" >> .env
        [ -n "$MAIL_PROVIDER" ] && echo "MAIL_PROVIDER=${MAIL_PROVIDER}" >> .env
        [ -n "$CUSTOM_MAIL_PROVIDER_PLUGINS" ] && echo "CUSTOM_MAIL_PROVIDER_PLUGINS=${CUSTOM_MAIL_PROVIDER_PLUGINS}" >> .env
        [ -n "$MAILPIT_BASE_URL" ] && echo "MAILPIT_BASE_URL=${MAILPIT_BASE_URL}" >> .env
        echo "Wrote .env:"
        cat .env

    # ADMIN_USERNAME/ADMIN_PASSWORD are intentionally NOT written to .env:
    # dotenv treats an unquoted "#" as the start of a comment (and no quoting
    # scheme is fully transparent for arbitrary secret bytes), so a password
    # containing "#" would be silently truncated. Passing them as real
    # process env vars below avoids any file-parsing/escaping concerns.
    # DOMAINS doubles as the btr-run reporter's path filter. The blob report
    # gets a name unique to this shard, so the blobs of every shard can be
    # downloaded into one directory for `report-suite` to merge.
    - name: Run tests
      shell: bash
      env:
        DOMAINS: ${{ inputs.domains }}
        FEATURES: ${{ inputs.features }}
        EXCLUDE_FEATURES: ${{ inputs.exclude_features }}
        ADMIN_USERNAME: ${{ inputs.admin_username }}
        ADMIN_PASSWORD: ${{ inputs.admin_password }}
        # A secret, so a process env var rather than a .env line (see above).
        OPENINBOX_API_KEY: ${{ inputs.openinbox_api_key }}
        SHARD: ${{ inputs.shard }}
        RUN_ID_SUFFIX: ${{ inputs.run_id_suffix }}
        CI_PROFILE: ${{ inputs.profile }}
        PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ inputs.artifact_suffix }}.zip
      run: |
        set -euo pipefail
        args=()
        if [ -n "${DOMAINS// /}" ]; then
          for d in $DOMAINS; do args+=("tests/$d"); done
        fi
        grep_expr=""
        if [ -n "${FEATURES// /}" ]; then
          grep_expr="$(echo "$FEATURES" | xargs | tr ' ' '|')"
        fi
        grep_invert_expr=""
        if [ -n "${EXCLUDE_FEATURES// /}" ]; then
          grep_invert_expr="$(echo "$EXCLUDE_FEATURES" | xargs | tr ' ' '|')"
        fi
        cmd=(npx playwright test)
        if [ ${#args[@]} -gt 0 ]; then cmd+=("${args[@]}"); fi
        if [ -n "$grep_expr" ]; then cmd+=(--grep "$grep_expr"); fi
        if [ -n "$grep_invert_expr" ]; then cmd+=(--grep-invert "$grep_invert_expr"); fi
        if [ -n "$SHARD" ]; then cmd+=(--shard "$SHARD"); fi
        echo "Running: ${cmd[*]}"
        "${cmd[@]}"

    # Everything a report needs — results, attachments (a11y scans, traces,
    # videos, screenshots) — is in the blob; `report-suite` builds the reports
    # from it. Short retention: the merged reports are the durable artifacts.
    - name: Upload blob report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: blob-report-${{ inputs.artifact_suffix }}
        path: blob-report/
        retention-days: 3
        if-no-files-found: warn
