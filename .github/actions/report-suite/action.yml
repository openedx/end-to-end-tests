name: Report E2E suite
description: >
  Merge one or more blob reports written by the run-suite action (one per shard,
  possibly from several jobs) with `playwright merge-reports`, which replays
  them through the suite's own reporters (`merge.config.ts`). The result is the
  HTML report and test-results/ report files a single unsharded run writes.
  Then write the job summary, publish BTR results when a sheet is given, and
  upload the reports.

inputs:
  blob_dir:
    description: 'Directory holding the blob report .zip files to merge.'
    required: true
  lms_base_url:
    description: 'LMS origin the run targeted; recorded in btr-run.json and the timings CSVs.'
    required: true
  domains:
    description: 'The domains filter the run used (space-separated), recorded as btr-run.json''s path filter.'
    required: false
    default: ''
  artifact_suffix:
    description: 'Suffix of the uploaded playwright-report-* and suite-reports-* artifacts (e.g. the release name).'
    required: true
  btr_release:
    description: 'Open edX release the target runs (main, verawood, …). Recorded in the BTR run report; required when btr_sheet_url is set.'
    required: false
    default: ''
  btr_test_ref:
    description: 'Git ref of this repo that was checked out, when it differs from the workflow''s branch. Recorded in the BTR run report.'
    required: false
    default: ''
  btr_sheet_url:
    description: 'Google Sheets URL of the per-release BTR results spreadsheet. Empty = do not publish.'
    required: false
    default: ''
  btr_update_latest:
    description: 'Whether this run may overwrite the sheet''s "Latest" tab (true for an unfiltered run of the default branch).'
    required: false
    default: 'true'
  btr_environment:
    description: 'GitHub Environment name for external-target runs; shown as the sheet''s Target and in the run tab title.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # A no-op after run-suite in the same job, which has already installed both.
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        if [ -d node_modules ]; then
          echo "node_modules already installed."
        else
          npm ci
        fi

    # BTR_RELEASE / BTR_TEST_REF / DOMAINS / LMS_BASE_URL feed the reporters'
    # run metadata (src/reporting/btr-run-reporter.ts, timing-reporter.ts), as
    # they do in a run. The run's own test-results/ report files are replaced.
    - name: Merge blob reports
      shell: bash
      env:
        BLOB_DIR: ${{ inputs.blob_dir }}
        LMS_BASE_URL: ${{ inputs.lms_base_url }}
        DOMAINS: ${{ inputs.domains }}
        BTR_RELEASE: ${{ inputs.btr_release }}
        BTR_TEST_REF: ${{ inputs.btr_test_ref }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        blobs=("$BLOB_DIR"/*.zip)
        if [ ${#blobs[@]} -eq 0 ]; then
          echo "::error::No blob reports in ${BLOB_DIR}: no shard got as far as running the suite."
          exit 1
        fi
        echo "Merging ${#blobs[@]} blob report(s): ${blobs[*]}"
        rm -rf playwright-report test-results/btr-coverage.json test-results/btr-run.json \
          test-results/a11y-violations.json test-results/timings-tests.csv test-results/timings-steps.csv
        npx playwright merge-reports --config merge.config.ts "$BLOB_DIR"

    - name: Suite reports to job summary
      if: ${{ !cancelled() }}
      shell: bash
      run: node scripts/job-summary.mjs

    # Opt-in: only when the caller resolved a sheet for this release (see the
    # "Resolve BTR results sheet" step in the workflows). Its failure is visible
    # on this step alone; the test outcome is unaffected. A failed publish can
    # be redone from the suite-reports artifact's btr-run.json.
    #
    # Credentials are never an input: the publisher reads BTR_SHEET_CREDENTIALS
    # from the environment, which the calling workflow sets from the repository
    # or Environment secret of that name. Unset = warn and skip the publish.
    - name: Publish BTR results to Google Sheet
      if: ${{ !cancelled() && inputs.btr_sheet_url != '' }}
      shell: bash
      env:
        BTR_SHEET_URL: ${{ inputs.btr_sheet_url }}
        BTR_RELEASE: ${{ inputs.btr_release }}
        BTR_UPDATE_LATEST: ${{ inputs.btr_update_latest }}
        BTR_ENVIRONMENT: ${{ inputs.btr_environment }}
      run: |
        set -euo pipefail
        if [ -z "$BTR_RELEASE" ]; then
          echo "::error::btr_sheet_url is set but btr_release is empty; the publisher needs the release to pick the sheet's identity."
          exit 1
        fi
        node scripts/publish-btr-sheet.mts \
          --release "$BTR_RELEASE" \
          --sheet "$BTR_SHEET_URL" \
          --update-latest "${BTR_UPDATE_LATEST:-true}" \
          --environment "$BTR_ENVIRONMENT"

    # The HTML report carries every test's attachments (traces, videos,
    # screenshots, error context, a11y scans) under playwright-report/data/.
    # test-results/ holds only the merged report files here, but listing both
    # keeps the artifact's playwright-report/ + test-results/ layout.
    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report-${{ inputs.artifact_suffix }}
        path: |
          playwright-report/
          test-results/
        retention-days: 14
        if-no-files-found: ignore

    # Upload BTR and A11y artifacts. btr-run.json is the input to the
    # results-sheet publisher, so a failed publish can be redone from the
    # artifact.
    - name: Upload suite reports (a11y backlog + BTR coverage + BTR run detail + timings)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: suite-reports-${{ inputs.artifact_suffix }}
        path: |
          test-results/a11y-violations.json
          test-results/btr-coverage.json
          test-results/btr-run.json
          test-results/timings-tests.csv
          test-results/timings-steps.csv
        retention-days: 30
        if-no-files-found: warn
