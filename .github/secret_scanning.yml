# Configuration for GitHub secret scanning (both the periodic repository
# scan and push protection):
# https://docs.github.com/en/code-security/secret-scanning/configuring-secret-scanning-for-your-repositories

paths-ignore:
  # Tutor config for the ephemeral, CI-only "local" installation used by
  # .github/workflows/run_tests_tutor.yml. The credentials in this file
  # (MySQL passwords, Django secret key, OAuth2 client secret) are:
  #   - Generated once, checked in on purpose, and never rotated
  #   - Only ever used inside a Docker network created fresh per workflow
  #     run and torn down immediately after, with no exposure outside the
  #     GitHub Actions runner
  #   - Not reused for any other environment or service
  # Rotating them provides no security benefit, so we exclude this path to
  # avoid false-positive alerts and push-protection blocks.
  - .ci/config.yml
