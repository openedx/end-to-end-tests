name: Tutor E2E Test

# Manually stand up a Tutor "local" Open edX installation and run the end-to-end
# suite against it. Everything is provisioned from scratch on the runner, so this
# is a heavier, on-demand job (not part of the fast PR gate in ci.yml).
#
# Also runs on a schedule (09:00 UTC, Mondays and Fridays) against this
# repo's main branch with the "main" Open edX release, to catch regressions
# between manual runs. Scheduled runs always use those two defaults; the
# domains/features inputs only apply to manual `workflow_dispatch` runs.
#
# Also callable (`workflow_call`) so `ci.yml` can run it as a non-blocking,
# Docker-based check against the "main" and last-released environments on
# every PR/push, without duplicating the Tutor provisioning steps.
#
# For the "main" release the Docker images come prebuilt from
# build_tutor_main_images.yml (nightly, pushed to ghcr.io); see that workflow.
#
# Jobs: `plan` expands the selected CI profiles (.ci/profiles.json: a Tutor
# configuration + capability delta + shard count) into one `run` job per
# shard, each provisioning its own installation and uploading a blob report;
# `merge` combines the blobs into the release's single HTML report and suite
# reports (the report-suite action), under the artifact names a one-job run
# used, and publishes BTR results.
#
# BTR results sheet: schedule and workflow_dispatch runs publish the run's
# BTR-tagged results (from the merge job) to the per-release Google Sheet named
# by the repository variable BTR_SHEET_URL_<RELEASE> (e.g.
# BTR_SHEET_URL_VERAWOOD), using the repository/Environment secret
# BTR_SHEET_CREDENTIALS. Credentials are never a workflow input: without that
# secret the publish is skipped with a warning and the run still passes. Unset
# variable = no publish. Runs called from ci.yml (PR/push) never publish. See
# src/reporting/README.md.

on:
  schedule:
    # GitHub Actions schedules run in UTC only (there is no timezone option):
    # 09:00 UTC is 5am US Eastern during daylight time, 4am in winter.
    - cron: '0 9 * * 1,5'
  workflow_dispatch:
    inputs:
      openedx_release:
        description: 'Open edX named release (drives the Tutor + plugin major version).'
        type: choice
        default: verawood
        options:
          - main
          - verawood
          - ulmo
          - teak
          - sumac
          - redwood
      test_ref:
        description: 'Git ref (branch, tag, or commit SHA) of this repo to test. Defaults to the branch this workflow runs from.'
        type: string
        default: ''
      domains:
        description: 'Domains to run, space-separated (e.g. "lms studio"). Empty = all.'
        type: string
        default: ''
      features:
        description: 'Feature/capability tags to run, space-separated (e.g. "@smoke @discussions"). Empty = all.'
        type: string
        default: ''
      exclude_features:
        description: 'Feature/tags to exclude, space-separated (e.g. "@unit"). Empty = exclude nothing.'
        type: string
        default: ''
      capabilities:
        description: 'Override the release''s capabilities for this run (comma-separated); each profile''s delta still applies. Empty = the release default from .ci/openedx-releases.json.'
        type: string
        default: ''
      profiles:
        description: 'CI profiles to run (keys of .ci/profiles.json), space-separated, e.g. "default extended". Each profile runs as its shards, and the merge job combines them into one report.'
        type: string
        default: 'default'
      btr_sheet_url:
        description: 'Override: publish BTR results to this Google Sheet instead of the release''s BTR_SHEET_URL_<RELEASE> variable. Empty = use the variable (or do not publish if unset).'
        type: string
        default: ''
  workflow_call:
    inputs:
      openedx_release:
        description: 'Open edX named release (drives the Tutor + plugin major version).'
        type: string
        default: verawood
      test_ref:
        description: 'Git ref (branch, tag, or commit SHA) of this repo to test. Defaults to the branch this workflow runs from.'
        type: string
        default: ''
      domains:
        description: 'Domains to run, space-separated (e.g. "lms studio"). Empty = all.'
        type: string
        default: ''
      features:
        description: 'Feature/capability tags to run, space-separated (e.g. "@smoke @discussions"). Empty = all.'
        type: string
        default: ''
      exclude_features:
        description: 'Feature/tags to exclude, space-separated (e.g. "@unit"). Empty = exclude nothing.'
        type: string
        default: ''
      capabilities:
        description: 'Override the release''s capabilities for this run (comma-separated); each profile''s delta still applies. Empty = the release default from .ci/openedx-releases.json.'
        type: string
        default: ''
      profiles:
        description: 'CI profiles to run (keys of .ci/profiles.json), space-separated, e.g. "default extended". Each profile runs as its shards, and the merge job combines them into one report.'
        type: string
        default: 'default'

permissions:
  contents: read
  # Pull the prebuilt "main" images from this repo's ghcr.io namespace.
  packages: read

env:
  TUTOR_ROOT: ./.ci/
  # Admin account provisioned in the Tutor install and exposed to the suite.
  ADMIN_USERNAME: admin
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: e2e-admin-password

jobs:
  # What the run and merge jobs share, resolved once: the release's Tutor
  # constraint and capabilities, the profile × shard job matrix
  # (.ci/profiles.json, via scripts/ci-profiles.mts) and the BTR results sheet.
  plan:
    runs-on: ubuntu-latest
    env:
      # workflow_dispatch runs use the chosen input (default: verawood);
      # schedule runs always target the "main" Open edX release.
      OPENEDX_RELEASE: ${{ (github.event_name == 'schedule' && 'main') || inputs.openedx_release }}
    outputs:
      release: ${{ steps.release.outputs.release }}
      tutor_constraint: ${{ steps.release.outputs.tutor_constraint }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      sheet_url: ${{ steps.btr.outputs.sheet_url }}
      update_latest: ${{ steps.btr.outputs.update_latest }}
    steps:
      - name: Checkout (test ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Resolve release configuration
        id: release
        run: |
          set -euo pipefail
          RELEASE="${OPENEDX_RELEASE}"
          ENTRY=$(jq -e --arg r "$RELEASE" '.[$r]' .ci/openedx-releases.json) || {
            echo "::error::Unknown Open edX release '$RELEASE' — add it to .ci/openedx-releases.json"
            exit 1
          }
          CONSTRAINT=$(echo "$ENTRY" | jq -r '.tutorConstraint')
          RELEASE_CAPABILITIES=$(echo "$ENTRY" | jq -r '.capabilities')
          if [ "$RELEASE" != "main" ]; then
            echo "Open edX '${RELEASE}' -> Tutor constraint '${CONSTRAINT}'"
          else
            echo "Open edX 'main' -> Tutor from GitHub main branch"
          fi
          {
            echo "release=${RELEASE}"
            echo "tutor_constraint=${CONSTRAINT}"
            echo "capabilities=${RELEASE_CAPABILITIES}"
          } >> "$GITHUB_OUTPUT"

      # A dispatch `capabilities` override replaces the release's list; each
      # profile's delta applies on top of whichever list that leaves.
      - name: Build the profile × shard matrix
        id: matrix
        env:
          PROFILES: ${{ inputs.profiles || 'default' }}
          OVERRIDE_CAPABILITIES: ${{ inputs.capabilities }}
          RELEASE_CAPABILITIES: ${{ steps.release.outputs.capabilities }}
        run: |
          set -euo pipefail
          MATRIX=$(node scripts/ci-profiles.mts matrix \
            --profiles "$PROFILES" \
            --release "$OPENEDX_RELEASE" \
            --release-capabilities="${OVERRIDE_CAPABILITIES:-$RELEASE_CAPABILITIES}")
          echo "$MATRIX" | jq .
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

      # Which sheet (if any) this run publishes to, and whether it may replace the
      # sheet's "Latest" tab. `vars` is dumped as JSON because expressions have no
      # upper-case function to build the variable name from the release.
      - name: Resolve BTR results sheet
        id: btr
        env:
          EVENT_NAME: ${{ github.event_name }}
          OVERRIDE_URL: ${{ inputs.btr_sheet_url }}
          VARS_JSON: ${{ toJSON(vars) }}
          TEST_REF: ${{ inputs.test_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FILTERED: ${{ inputs.domains != '' || inputs.features != '' || inputs.exclude_features != '' }}
        run: |
          set -euo pipefail
          VAR_NAME="BTR_SHEET_URL_${OPENEDX_RELEASE^^}"
          URL=""
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              URL="${OVERRIDE_URL:-$(jq -r --arg k "$VAR_NAME" '.[$k] // empty' <<< "$VARS_JSON")}"
              if [ -z "$URL" ]; then
                echo "::notice::No BTR results sheet for '${OPENEDX_RELEASE}': set the ${VAR_NAME} repository variable (or the btr_sheet_url input) to publish."
              fi
              ;;
            *)
              echo "BTR results are not published for '${EVENT_NAME}' runs."
              ;;
          esac
          REF="${TEST_REF:-$GITHUB_REF_NAME}"
          UPDATE_LATEST=false
          if [ "$FILTERED" != "true" ] && [ "$REF" = "$DEFAULT_BRANCH" ]; then
            UPDATE_LATEST=true
          fi
          {
            echo "sheet_url=${URL}"
            echo "test_ref=${TEST_REF}"
            echo "update_latest=${UPDATE_LATEST}"
          } >> "$GITHUB_OUTPUT"
          [ -n "$URL" ] && echo "Publishing to ${URL} (update Latest: ${UPDATE_LATEST}, ref: ${REF})" || true

  # One job per shard of each selected profile, each against its own Tutor
  # installation, so shards share no users, courses or site settings.
  run:
    name: ${{ matrix.profile }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OPENEDX_RELEASE: ${{ needs.plan.outputs.release }}
    steps:
      - name: Checkout (test ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_ref }}

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Install Tutor and plugins (named release)
        if: env.OPENEDX_RELEASE != 'main'
        run: |
          set -euo pipefail
          C='${{ needs.plan.outputs.tutor_constraint }}'
          pip install \
            "tutor${C}" \
            "tutor-mfe${C}" \
            "tutor-forum${C}" \
            "tutor-notes${C}"

      - name: Install Tutor and plugins (main branch)
        if: env.OPENEDX_RELEASE == 'main'
        uses: ./.github/actions/install-tutor-main

      # Published Tutor plugins the profile uses on this release
      # (`tutorExtensions` in .ci/profiles.json, e.g. tutor-contrib-codejail),
      # each pinned to the release's Tutor line by the plan job.
      - name: Install the profile's Tutor extensions
        if: join(matrix.tutorPip, '') != ''
        env:
          TUTOR_PIP: ${{ join(matrix.tutorPip, ' ') }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # TUTOR_PIP is a deliberate word list
          pip install $TUTOR_PIP

      # Tutor "main" images aren't always reliably published, especially for
      # the plugins. So build_tutor_main_images.yml builds them nightly and
      # pushes them to this repo's ghcr.io namespace.
      #
      # Point Tutor at those names (via TUTOR_* env vars, which apply to every
      # later step) so the launch below pulls them instead of building.
      - name: Point Tutor at the prebuilt main images (main only)
        if: env.OPENEDX_RELEASE == 'main'
        run: .ci/tutor-main-images.sh "ghcr.io/${{ github.repository }}"

      - name: Capture installed Tutor version
        id: tutor_version
        run: |
          set -euo pipefail
          echo "version=$(tutor --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      # If we don't load the correct config the database restore will
      # fail or the dump will create an artifact that can't be restored
      - name: Assert Tutor config is loaded from .ci/config.yml
        run: |
          set -euo pipefail
          tutor config save
          tutor config printroot
          EXPECTED="End-to-end Local CI Test"
          ACTUAL=$(tutor config printvalue PLATFORM_NAME)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tutor config not loaded from .ci/config.yml."
            echo "::error::  PLATFORM_NAME is '$ACTUAL', expected '$EXPECTED'"
            echo "::error::  Check that TUTOR_ROOT is set correctly (currently: $TUTOR_ROOT)"
            pwd
            ls -la
            exit 1
          fi
          echo "Config OK: PLATFORM_NAME='$ACTUAL'"

      # Using cached db saves about 65% run time, or 20 mins
      # caches can be deleted from the Github actions UI if
      # a stale cache is causing problems
      - name: Restore MySQL migration cache
        id: mysql_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/mysql-dump/
          key: tutor-mysql-${{ env.OPENEDX_RELEASE }}-${{ steps.tutor_version.outputs.version }}

      ##################
      # We'll run out of disk pulling or building images if we don't clear up
      # some space
      - name: Free Disk Space (main only)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        if: env.OPENEDX_RELEASE == 'main'
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      # GITHUB_TOKEN can read packages published by this repo's workflows, so
      # this works even while the ghcr.io packages are private. Fork PRs get a
      # read-only token, which should be all that is needed.
      - name: Log in to GitHub Container Registry (main only)
        if: env.OPENEDX_RELEASE == 'main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || \
            echo "::warning::ghcr.io login failed; pulling anonymously."

      - name: Pull prebuilt main images (main only)
        id: pull_images
        if: env.OPENEDX_RELEASE == 'main'
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086  # TUTOR_MAIN_IMAGES is a deliberate word list
          if tutor images pull $TUTOR_MAIN_IMAGES; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not pull prebuilt main images from ghcr.io; building them on this runner instead. Has build_tutor_main_images.yml run for this repository?"
            echo "pulled=false" >> "$GITHUB_OUTPUT"
          fi

      # Necessary to keep github from killing our build process
      - name: Setup Docker Buildx (main only, pull failed)
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        if: env.OPENEDX_RELEASE == 'main' && steps.pull_images.outputs.pulled != 'true'
        with:
          buildkitd-config-inline: |
            # Keeps Github from killing MFE builds for CPU usage
            [worker.oci]
              max-parallelism = 2

      - name: Build images (main only, pull failed)
        if: env.OPENEDX_RELEASE == 'main' && steps.pull_images.outputs.pulled != 'true'
        run: |
          # shellcheck disable=SC2086
          tutor images build $TUTOR_MAIN_IMAGES

      - name: Tutor launch (cache miss — runs migrations)
        if: steps.mysql_cache.outputs.cache-hit != 'true'
        run: tutor local launch --non-interactive --skip-build

      - name: Tutor start + restore database (cache hit — skip migrations)
        if: steps.mysql_cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          tutor config save
          MYSQL_ROOT_PASSWORD=$(tutor config printvalue MYSQL_ROOT_PASSWORD)
          tutor local start permissions mysql -d
          docker ps
          MYSQL_CONTAINER=$(docker ps -qf "name=tutor*.*mysql*")
          # Wait for MySQL to accept connections
          for i in $(seq 1 30); do
            if docker exec "$MYSQL_CONTAINER" mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1" &>/dev/null 2>&1; then
              echo "MySQL is ready."
              break
            fi
            echo "Waiting for MySQL ($i/30)..."
            sleep 3
          done
          # Restore the pre-migrated dump via docker exec (bypasses tutor wrapper
          # which pollutes stdout with the docker compose invocation, corrupting the SQL)
          docker exec -i "$MYSQL_CONTAINER" mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" < .ci/mysql-dump/dump.sql
          # Init is now fast: Django sees all migrations as already applied
          # ~20 minute savings
          tutor local do init
          tutor local stop
          tutor local start -d

      - name: Dump MySQL and save migration cache (cache miss only)
        if: steps.mysql_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci/mysql-dump
          MYSQL_ROOT_PASSWORD=$(tutor config printvalue MYSQL_ROOT_PASSWORD)
          # Use docker exec directly — tutor local exec prints the docker compose
          # invocation to stdout, which would corrupt the dump file
          docker ps
          MYSQL_CONTAINER=$(docker ps -qf "name=tutor*.*mysql*")
          # Dump only application databases -- excluding mysql/sys avoids ALTER USER
          # errors on restore caused by MySQL 8 serialising password changes for
          # users that do not exist yet in the target instance.
          APP_DATABASES=$(docker exec "$MYSQL_CONTAINER" mysql \
            -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" -sN -e \
            "SELECT schema_name FROM information_schema.schemata \
             WHERE schema_name NOT IN ('information_schema','performance_schema','mysql','sys')")
          docker exec "$MYSQL_CONTAINER" mysqldump \
            -h 127.0.0.1 \
            -u root -p"$MYSQL_ROOT_PASSWORD" \
            --databases $APP_DATABASES \
            --single-transaction \
            --quick \
            > .ci/mysql-dump/dump.sql
          echo "Dump size: $(du -sh .ci/mysql-dump/dump.sql | cut -f1)"

      - name: Save MySQL migration cache
        if: steps.mysql_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/mysql-dump/
          key: tutor-mysql-${{ env.OPENEDX_RELEASE }}-${{ steps.tutor_version.outputs.version }}

      # The profile's Tutor plugins (.ci/profiles.json): each file is copied into
      # Tutor's plugin root and enabled by its file name. .ci/tutor/e2e_base.py
      # documents the settings every profile starts from.
      # Extensions with an init task (codejail loads its AppArmor profile onto
      # the host) run it before the restart, so their services start confined.
      - name: Configure Tutor
        env:
          TUTOR_PLUGIN_FILES: ${{ join(matrix.tutorPlugins, ' ') }}
          TUTOR_EXTENSION_PLUGINS: ${{ join(matrix.tutorEnable, ' ') }}
          TUTOR_INIT_PLUGINS: ${{ join(matrix.tutorInit, ' ') }}
        run: |
          set -euo pipefail
          PLUGINS_ROOT="$(tutor plugins printroot)"
          mkdir -p "$PLUGINS_ROOT"
          for file in $TUTOR_PLUGIN_FILES; do
            name="$(basename "$file" .py)"
            cp "$file" "${PLUGINS_ROOT}/${name}.py"
            tutor plugins enable "$name"
            echo "Enabled Tutor plugin '${name}' from ${file}"
          done
          for name in $TUTOR_EXTENSION_PLUGINS; do
            tutor plugins enable "$name"
            echo "Enabled Tutor extension '${name}'"
          done
          tutor config save
          for name in $TUTOR_INIT_PLUGINS; do
            tutor local do init --limit "$name"
          done
          tutor local stop
          tutor local start -d

      - name: Provision demo course and admin user
        run: |
          set -euo pipefail
          tutor local do importdemocourse
          tutor local do createuser \
            --staff --superuser \
            --password "$ADMIN_PASSWORD" \
            "$ADMIN_USERNAME" "$ADMIN_EMAIL"
          tutor local exec cms ./manage.py cms reindex_course --all --setup

      - name: Wait for the LMS to be healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://local.openedx.io/heartbeat >/dev/null; then
              echo "LMS is up."
              exit 0
            fi
            echo "Waiting for LMS to respond ($i/30)..."
            sleep 5
          done
          echo "::error::LMS did not become healthy in time."
          exit 1

      # Content the profile declares (`seedScripts`), e.g. the extended
      # profile's second-organization course and intro video.
      - name: Seed the profile's content
        if: join(matrix.seedScripts, '') != ''
        env:
          SEED_SCRIPTS: ${{ join(matrix.seedScripts, ' ') }}
        run: |
          set -euo pipefail
          for script in $SEED_SCRIPTS; do
            echo "Running ${script}"
            bash "$script"
          done

      - name: Run E2E suite
        uses: ./.github/actions/run-suite
        with:
          lms_base_url: http://local.openedx.io
          apps_base_url: http://apps.local.openedx.io
          cms_base_url: http://studio.local.openedx.io
          org: OpenedX
          course_key: course-v1:OpenedX+DemoX+DemoCourse
          capabilities: ${{ matrix.capabilities }}
          admin_username: ${{ env.ADMIN_USERNAME }}
          admin_password: ${{ env.ADMIN_PASSWORD }}
          mail_provider: mailpit
          mail_provider_plugins: ./plugins/mailpit.plugin.ts
          mailpit_base_url: http://localhost:8025
          domains: ${{ inputs.domains }}
          features: ${{ inputs.features }}
          # Always exclude the `@unit` project: those are pure-logic tests that
          # need no target, and the "Lint, types & unit tests" job in ci.yml
          # already runs them.
          exclude_features: ${{ inputs.exclude_features }} @unit
          shard: ${{ matrix.shard }}/${{ matrix.shards }}
          profile: ${{ matrix.profile }}
          select_grep: ${{ matrix.grep }}
          run_id_suffix: ${{ matrix.runIdSuffix }}
          artifact_suffix: ${{ env.OPENEDX_RELEASE }}-${{ matrix.profile }}-${{ matrix.shard }}

      # Collect the LMS/Studio logs whatever the outcome (`always()`, so they
      # survive a failed or cancelled run). `docker ps -a` catches the case
      # where a service died and therefore logged nothing.
      - name: Collect Tutor container logs
        if: always()
        run: |
          set -uo pipefail
          mkdir -p tutor-logs
          docker ps -a > tutor-logs/docker-ps.txt 2>&1 || true
          for service in lms cms lms-worker cms-worker mfe caddy; do
            echo "Collecting logs for '${service}'..."
            tutor local logs "$service" > "tutor-logs/${service}.log" 2>&1 || \
              echo "::warning::Could not collect logs for '${service}'."
          done
          ls -la tutor-logs/

      - name: Upload Tutor container logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tutor-logs-${{ env.OPENEDX_RELEASE }}-${{ matrix.profile }}-${{ matrix.shard }}
          path: tutor-logs/
          retention-days: 14
          if-no-files-found: warn

  # Combines every shard's blob report into the release's single HTML report
  # and suite reports, under the artifact names a one-job run used, then
  # writes the job summary and publishes BTR results. Runs whether or not
  # shards failed, so failures are reported.
  merge:
    name: Merge reports
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Read by scripts/publish-btr-sheet.mts inside the report-suite action,
      # which takes no credential input. Absent on workflow_call runs from
      # ci.yml, which do not publish anyway; the publisher warns and skips.
      BTR_SHEET_CREDENTIALS: ${{ secrets.BTR_SHEET_CREDENTIALS }}
    steps:
      - name: Checkout (test ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_ref }}

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-${{ needs.plan.outputs.release }}-*
          path: all-blob-reports
          merge-multiple: true

      - name: Report E2E suite
        uses: ./.github/actions/report-suite
        with:
          blob_dir: all-blob-reports
          lms_base_url: http://local.openedx.io
          domains: ${{ inputs.domains }}
          artifact_suffix: ${{ needs.plan.outputs.release }}
          btr_release: ${{ needs.plan.outputs.release }}
          btr_test_ref: ${{ inputs.test_ref }}
