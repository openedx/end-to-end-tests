name: Tutor E2E Test

# Manually stand up a Tutor "local" Open edX installation and run the end-to-end
# suite against it. Everything is provisioned from scratch on the runner, so this
# is a heavier, on-demand job (not part of the fast PR gate in ci.yml).
#
# Also runs on a schedule (5am US Eastern, Mondays and Fridays) against this
# repo's main branch with the "main" Open edX release, to catch regressions
# between manual runs. Scheduled runs always use those two defaults; the
# domains/features inputs only apply to manual `workflow_dispatch` runs.
#
# Also callable (`workflow_call`) so `ci.yml` can run it as a non-blocking,
# Docker-based check against the "main" and last-released environments on
# every PR/push, without duplicating the Tutor provisioning steps.

on:
  schedule:
    - cron: '0 5 * * 1,5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      openedx_release:
        description: 'Open edX named release (drives the Tutor + plugin major version).'
        type: choice
        default: verawood
        options:
          - main
          - verawood
          - ulmo
          - teak
          - sumac
          - redwood
      test_ref:
        description: 'Git ref (branch, tag, or commit SHA) of this repo to test. Defaults to the branch this workflow runs from.'
        type: string
        default: ''
      domains:
        description: 'Domains to run, space-separated (e.g. "lms studio"). Empty = all.'
        type: string
        default: ''
      features:
        description: 'Feature/capability tags to run, space-separated (e.g. "@smoke @discussions"). Empty = all.'
        type: string
        default: ''
      exclude_features:
        description: 'Feature/tags to exclude, space-separated (e.g. "@unit"). Empty = exclude nothing.'
        type: string
        default: ''
      capabilities:
        description: 'Override capabilities for this run (comma-separated). Empty = use the release default from .ci/openedx-releases.json.'
        type: string
        default: ''
  workflow_call:
    inputs:
      openedx_release:
        description: 'Open edX named release (drives the Tutor + plugin major version).'
        type: string
        default: verawood
      test_ref:
        description: 'Git ref (branch, tag, or commit SHA) of this repo to test. Defaults to the branch this workflow runs from.'
        type: string
        default: ''
      domains:
        description: 'Domains to run, space-separated (e.g. "lms studio"). Empty = all.'
        type: string
        default: ''
      features:
        description: 'Feature/capability tags to run, space-separated (e.g. "@smoke @discussions"). Empty = all.'
        type: string
        default: ''
      exclude_features:
        description: 'Feature/tags to exclude, space-separated (e.g. "@unit"). Empty = exclude nothing.'
        type: string
        default: ''
      capabilities:
        description: 'Override capabilities for this run (comma-separated). Empty = use the release default from .ci/openedx-releases.json.'
        type: string
        default: ''

permissions:
  contents: read

env:
  TUTOR_ROOT: ./.ci/
  # Admin account provisioned in the Tutor install and exposed to the suite.
  ADMIN_USERNAME: admin
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: e2e-admin-password

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # workflow_dispatch runs use the chosen input (default: verawood);
      # schedule runs always target the "main" Open edX release.
      OPENEDX_RELEASE: ${{ (github.event_name == 'schedule' && 'main') || inputs.openedx_release }}
    steps:
      - name: Checkout (test ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_ref }}

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Resolve release configuration
        id: release
        run: |
          set -euo pipefail
          RELEASE="${OPENEDX_RELEASE}"
          ENTRY=$(jq -e --arg r "$RELEASE" '.[$r]' .ci/openedx-releases.json) || {
            echo "::error::Unknown Open edX release '$RELEASE' — add it to .ci/openedx-releases.json"
            exit 1
          }
          CONSTRAINT=$(echo "$ENTRY" | jq -r '.tutorConstraint')
          RELEASE_CAPABILITIES=$(echo "$ENTRY" | jq -r '.capabilities')
          if [ "$RELEASE" != "main" ]; then
            echo "Open edX '${RELEASE}' -> Tutor constraint '${CONSTRAINT}'"
          else
            echo "Open edX 'main' -> Tutor from GitHub main branch"
          fi
          echo "tutor_constraint=${CONSTRAINT}" >> "$GITHUB_OUTPUT"
          echo "capabilities=${RELEASE_CAPABILITIES}" >> "$GITHUB_OUTPUT"

      - name: Install Tutor and plugins (named release)
        if: env.OPENEDX_RELEASE != 'main'
        run: |
          set -euo pipefail
          C='${{ steps.release.outputs.tutor_constraint }}'
          pip install \
            "tutor${C}" \
            "tutor-mfe${C}" \
            "tutor-forum${C}" \
            "tutor-notes${C}"

      - name: Install Tutor and plugins (main branch)
        if: env.OPENEDX_RELEASE == 'main'
        run: |
          set -euo pipefail
          git clone --branch=main --depth=1 https://github.com/overhangio/tutor.git /tmp/tutor-main
          pip install -e /tmp/tutor-main
          pip install \
            "tutor-forum@git+https://github.com/overhangio/tutor-forum@main" \
            "tutor-mfe@git+https://github.com/overhangio/tutor-mfe@main" \
            "tutor-notes@git+https://github.com/overhangio/tutor-notes@main"

      - name: Capture installed Tutor version
        id: tutor_version
        run: |
          set -euo pipefail
          echo "version=$(tutor --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      # If we don't load the correct config the database restore will
      # fail or the dump will create an artifact that can't be restored
      - name: Assert Tutor config is loaded from .ci/config.yml
        run: |
          set -euo pipefail
          tutor config save
          tutor config printroot
          EXPECTED="End-to-end Local CI Test"
          ACTUAL=$(tutor config printvalue PLATFORM_NAME)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tutor config not loaded from .ci/config.yml."
            echo "::error::  PLATFORM_NAME is '$ACTUAL', expected '$EXPECTED'"
            echo "::error::  Check that TUTOR_ROOT is set correctly (currently: $TUTOR_ROOT)"
            pwd
            ls -la
            exit 1
          fi
          echo "Config OK: PLATFORM_NAME='$ACTUAL'"

      # Using cached db saves about 65% run time, or 20 mins
      # caches can be deleted from the Github actions UI if
      # a stale cache is causing problems
      - name: Restore MySQL migration cache
        id: mysql_cache
        uses: actions/cache/restore@v4
        with:
          path: .ci/mysql-dump/
          key: tutor-mysql-${{ env.OPENEDX_RELEASE }}-${{ steps.tutor_version.outputs.version }}

      - name: Tutor launch (cache miss — runs migrations)
        if: steps.mysql_cache.outputs.cache-hit != 'true'
        run: tutor local launch --non-interactive

      - name: Tutor start + restore database (cache hit — skip migrations)
        if: steps.mysql_cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          tutor config save
          MYSQL_ROOT_PASSWORD=$(tutor config printvalue MYSQL_ROOT_PASSWORD)
          tutor local start permissions mysql -d
          MYSQL_CONTAINER=$(docker ps -qf "name=tutor_local.*mysql")
          # Wait for MySQL to accept connections
          for i in $(seq 1 30); do
            if docker exec "$MYSQL_CONTAINER" mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1" &>/dev/null 2>&1; then
              echo "MySQL is ready."
              break
            fi
            echo "Waiting for MySQL ($i/30)..."
            sleep 3
          done
          # Restore the pre-migrated dump via docker exec (bypasses tutor wrapper
          # which pollutes stdout with the docker compose invocation, corrupting the SQL)
          docker exec -i "$MYSQL_CONTAINER" mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" < .ci/mysql-dump/dump.sql
          # Init is now fast: Django sees all migrations as already applied
          # ~20 minute savings
          tutor local do init
          tutor local start -d

      - name: Dump MySQL and save migration cache (cache miss only)
        if: steps.mysql_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci/mysql-dump
          MYSQL_ROOT_PASSWORD=$(tutor config printvalue MYSQL_ROOT_PASSWORD)
          # Use docker exec directly — tutor local exec prints the docker compose
          # invocation to stdout, which would corrupt the dump file
          MYSQL_CONTAINER=$(docker ps -qf "name=tutor_local.*mysql")
          # Dump only application databases -- excluding mysql/sys avoids ALTER USER
          # errors on restore caused by MySQL 8 serialising password changes for
          # users that do not exist yet in the target instance.
          APP_DATABASES=$(docker exec "$MYSQL_CONTAINER" mysql \
            -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" -sN -e \
            "SELECT schema_name FROM information_schema.schemata \
             WHERE schema_name NOT IN ('information_schema','performance_schema','mysql','sys')")
          docker exec "$MYSQL_CONTAINER" mysqldump \
            -h 127.0.0.1 \
            -u root -p"$MYSQL_ROOT_PASSWORD" \
            --databases $APP_DATABASES \
            --single-transaction \
            --quick \
            > .ci/mysql-dump/dump.sql
          echo "Dump size: $(du -sh .ci/mysql-dump/dump.sql | cut -f1)"

      - name: Save MySQL migration cache
        if: steps.mysql_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/mysql-dump/
          key: tutor-mysql-${{ env.OPENEDX_RELEASE }}-${{ steps.tutor_version.outputs.version }}

      # Without this setting Playwright won't be able to complete most auth
      # tests due to not being able to activate the account via email.
      # This does mean that some tests around activation can't be completed
      # here.
      - name: Configure Tutor
        run: |
          set -euo pipefail
          mkdir -p "$(tutor plugins printroot)"
          cat > "$(tutor plugins printroot)/e2e_test.py" << 'EOF'
          from tutor import hooks

          hooks.Filters.ENV_PATCHES.add_item(
              (
                  "common-env-features",
                  """
          SKIP_EMAIL_VALIDATION: true
          """
              )
          )
          EOF
          tutor plugins enable e2e_test
          tutor config save
          tutor local restart

      - name: Provision demo course and admin user
        run: |
          set -euo pipefail
          tutor local do importdemocourse
          tutor local do createuser \
            --staff --superuser \
            --password "$ADMIN_PASSWORD" \
            "$ADMIN_USERNAME" "$ADMIN_EMAIL"

      - name: Wait for the LMS to be healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://local.openedx.io/heartbeat >/dev/null; then
              echo "LMS is up."
              exit 0
            fi
            echo "Waiting for LMS to respond ($i/30)..."
            sleep 5
          done
          echo "::error::LMS did not become healthy in time."
          exit 1

      - name: Run E2E suite
        uses: ./.github/actions/run-suite
        with:
          lms_base_url: http://local.openedx.io
          apps_base_url: http://apps.local.openedx.io
          cms_base_url: http://studio.local.openedx.io
          org: OpenedX
          course_key: course-v1:OpenedX+DemoX+DemoCourse
          capabilities: ${{ inputs.capabilities != '' && inputs.capabilities || steps.release.outputs.capabilities }}
          admin_username: ${{ env.ADMIN_USERNAME }}
          admin_password: ${{ env.ADMIN_PASSWORD }}
          domains: ${{ inputs.domains }}
          features: ${{ inputs.features }}
          exclude_features: ${{ inputs.exclude_features }}
          artifact_suffix: ${{ env.OPENEDX_RELEASE }}

      # Collect the LMS/Studio logs whatever the outcome (`always()`, so they
      # survive a failed or cancelled run). `docker ps -a` catches the case
      # where a service died and therefore logged nothing.
      - name: Collect Tutor container logs
        if: always()
        run: |
          set -uo pipefail
          mkdir -p tutor-logs
          docker ps -a > tutor-logs/docker-ps.txt 2>&1 || true
          for service in lms cms lms-worker cms-worker mfe caddy; do
            echo "Collecting logs for '${service}'..."
            tutor local logs "$service" > "tutor-logs/${service}.log" 2>&1 || \
              echo "::warning::Could not collect logs for '${service}'."
          done
          ls -la tutor-logs/

      - name: Upload Tutor container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutor-logs-${{ env.OPENEDX_RELEASE }}
          path: tutor-logs/
          retention-days: 14
          if-no-files-found: warn
