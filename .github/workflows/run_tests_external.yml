name: External Target E2E Test

# Run the end-to-end suite against an already-running Open edX installation
# (e.g. a Tutor dev environment, staging, or any provider-supplied server)
# instead of provisioning one on the runner. Configuration and credentials are
# supplied via workflow inputs and a GitHub Environment, so this workflow can
# be pointed at any target without hard-coding installation-specific values.
#
# To run against your own installation, either:
#   - Trigger this workflow with `workflow_dispatch` and fill in the inputs, or
#   - Fork/adapt it and store your target's base URLs and credentials in a
#     GitHub Environment (Settings > Environments), referenced via the
#     `environment` input below. Environment secrets are only exposed to runs
#     that select that environment, and can require manual approval.
#
# BTR results sheet: when `openedx_release` is given, the run publishes its
# BTR-tagged results to the Google Sheet named by the BTR_SHEET_URL_<RELEASE>
# variable (an Environment-scoped variable overrides the repository one), using
# the BTR_SHEET_CREDENTIALS secret (Environment or repository); without that
# secret the publish is skipped with a warning. See
# src/reporting/README.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment to source secrets (ADMIN_USERNAME/ADMIN_PASSWORD) from.'
        type: string
        required: true
      test_ref:
        description: 'Git ref (branch, tag, or commit SHA) of this repo to test. Defaults to the branch this workflow runs from.'
        type: string
        default: ''
      lms_base_url:
        description: 'LMS origin, e.g. https://courses.example.com'
        type: string
        required: true
      apps_base_url:
        description: 'MFE host origin, e.g. https://apps.example.com'
        type: string
        required: true
      cms_base_url:
        description: 'Studio (CMS) origin. Leave empty to skip Studio specs.'
        type: string
        default: ''
      org:
        description: 'Organization short code used when creating/locating content.'
        type: string
        default: ''
      course_key:
        description: 'Default course to target in course-completion specs.'
        type: string
        default: ''
      capabilities:
        description: 'Comma-separated capabilities enabled on the target (e.g. discussions,notes).'
        type: string
        default: ''
      account_backend:
        description: 'ACCOUNT_BACKEND override. "automatic" (default) reuses the registration session and works on a default install; "manual" is interactive and not usable in CI.'
        type: choice
        default: automatic
        options:
          - automatic
          - manual
      allow_cross_site_origins:
        description: 'Set true when LMS/Studio/MFE origins are not same-site.'
        type: boolean
        default: false
      mail_provider:
        description: 'Mailbox the target''s notification e-mail can be read from. "openinbox" needs an OPENINBOX_API_KEY secret in the Environment and a target that sends real mail; declare email-inbox in capabilities to run the e-mail specs.'
        type: choice
        default: none
        options:
          - none
          - openinbox
      domains:
        description: 'Domains to run, space-separated (e.g. "lms studio"). Empty = all.'
        type: string
        default: ''
      features:
        description: 'Feature/capability tags to run, space-separated (e.g. "@smoke @discussions"). Empty = all.'
        type: string
        default: ''
      exclude_features:
        description: 'Feature/tags to exclude, space-separated (e.g. "@unit"). Empty = exclude nothing.'
        type: string
        default: ''
      openedx_release:
        description: 'Open edX release the target runs (a key of .ci/openedx-releases.json, e.g. verawood). Enables publishing BTR results to that release''s sheet. Empty = do not publish.'
        type: string
        default: ''
      btr_sheet_url:
        description: 'Override: publish BTR results to this Google Sheet instead of the release''s BTR_SHEET_URL_<RELEASE> variable. Requires openedx_release.'
        type: string
        default: ''

permissions:
  contents: read
  # Needed to look up whether `inputs.environment` is a real GitHub
  # Environment (the Environments API lives under the Deployments
  # permission scope).
  deployments: read

jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      # Read by scripts/publish-btr-sheet.mts inside the report-suite action, which
      # takes no credential input. Unset (no such repository/Environment secret)
      # = the publisher warns and skips, leaving the run's result unchanged.
      BTR_SHEET_CREDENTIALS: ${{ secrets.BTR_SHEET_CREDENTIALS }}
    steps:
      - name: Checkout (test ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_ref }}

      # `environment:` above silently proceeds with empty secrets if the name
      # doesn't match a configured Environment, so check it explicitly here.
      # The other inputs are validated too, since GitHub's `workflow_dispatch`
      # form only enforces `required`/`type`, not format or content.
      - name: Validate workflow inputs
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment }}
          LMS_BASE_URL: ${{ inputs.lms_base_url }}
          APPS_BASE_URL: ${{ inputs.apps_base_url }}
          CMS_BASE_URL: ${{ inputs.cms_base_url }}
          DOMAINS: ${{ inputs.domains }}
          FEATURES: ${{ inputs.features }}
          EXCLUDE_FEATURES: ${{ inputs.exclude_features }}
          OPENEDX_RELEASE: ${{ inputs.openedx_release }}
          BTR_SHEET_URL: ${{ inputs.btr_sheet_url }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          if [ -n "$OPENEDX_RELEASE" ]; then
            jq -e --arg r "$OPENEDX_RELEASE" '.[$r]' .ci/openedx-releases.json >/dev/null 2>&1 || \
              fail "openedx_release '${OPENEDX_RELEASE}' is not a key of .ci/openedx-releases.json"
          fi
          if [ -n "$BTR_SHEET_URL" ]; then
            [ -n "$OPENEDX_RELEASE" ] || fail "btr_sheet_url requires openedx_release, so the publisher knows which release the sheet is for"
            case "$BTR_SHEET_URL" in
              https://docs.google.com/spreadsheets/d/*) ;;
              *) fail "btr_sheet_url must look like https://docs.google.com/spreadsheets/d/<id>/…, got '${BTR_SHEET_URL}'" ;;
            esac
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT}" >/dev/null 2>&1; then
            fail "environment '${ENVIRONMENT}' does not exist on ${GITHUB_REPOSITORY}. Create it under Settings > Environments."
          fi

          # environment also becomes artifact_suffix (part of the uploaded
          # artifact names in run-suite and report-suite). Environment names allow characters,
          # like "/", that actions/upload-artifact rejects, so check for
          # those explicitly rather than let the upload step fail late.
          if echo "$ENVIRONMENT" | grep -qE '["/\\:<>|*?[:cntrl:]]'; then
            fail "environment '${ENVIRONMENT}' contains a character not allowed in an artifact name. Avoid: \" / \\ : < > | * ?"
          fi

          for pair in "lms_base_url:${LMS_BASE_URL}" "apps_base_url:${APPS_BASE_URL}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            case "$value" in
              http://*|https://*) ;;
              *) fail "${name} must be an http(s) URL, got '${value}'" ;;
            esac
          done

          if [ -n "$CMS_BASE_URL" ]; then
            case "$CMS_BASE_URL" in
              http://*|https://*) ;;
              *) fail "cms_base_url must be an http(s) URL, got '${CMS_BASE_URL}'" ;;
            esac
          fi

          if [ -n "${DOMAINS// /}" ]; then
            for d in $DOMAINS; do
              [ -d "tests/$d" ] || fail "domains entry '$d' has no matching tests/$d directory"
            done
          fi

          if [ -n "${FEATURES// /}" ]; then
            for f in $FEATURES; do
              case "$f" in
                @*) ;;
                *) fail "features entry '$f' should start with '@' (e.g. @smoke)" ;;
              esac
            done
          fi

          if [ -n "${EXCLUDE_FEATURES// /}" ]; then
            for f in $EXCLUDE_FEATURES; do
              case "$f" in
                @*) ;;
                *) fail "exclude_features entry '$f' should start with '@' (e.g. @unit)" ;;
              esac
            done
          fi

          echo "All inputs valid."

      # Which sheet (if any) this run publishes to. `vars` here includes the
      # selected Environment's variables, which override repository ones.
      - name: Resolve BTR results sheet
        id: btr
        env:
          OPENEDX_RELEASE: ${{ inputs.openedx_release }}
          OVERRIDE_URL: ${{ inputs.btr_sheet_url }}
          VARS_JSON: ${{ toJSON(vars) }}
          TEST_REF: ${{ inputs.test_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FILTERED: ${{ inputs.domains != '' || inputs.features != '' || inputs.exclude_features != '' }}
        run: |
          set -euo pipefail
          URL=""
          if [ -n "$OPENEDX_RELEASE" ]; then
            VAR_NAME="BTR_SHEET_URL_${OPENEDX_RELEASE^^}"
            URL="${OVERRIDE_URL:-$(jq -r --arg k "$VAR_NAME" '.[$k] // empty' <<< "$VARS_JSON")}"
            if [ -z "$URL" ]; then
              echo "::notice::No BTR results sheet for '${OPENEDX_RELEASE}': set the ${VAR_NAME} variable (repository or Environment) or the btr_sheet_url input to publish."
            fi
          else
            echo "openedx_release not given; BTR results are not published."
          fi
          REF="${TEST_REF:-$GITHUB_REF_NAME}"
          UPDATE_LATEST=false
          if [ "$FILTERED" != "true" ] && [ "$REF" = "$DEFAULT_BRANCH" ]; then
            UPDATE_LATEST=true
          fi
          {
            echo "sheet_url=${URL}"
            echo "update_latest=${UPDATE_LATEST}"
          } >> "$GITHUB_OUTPUT"
          [ -n "$URL" ] && echo "Publishing to ${URL} (update Latest: ${UPDATE_LATEST}, ref: ${REF})" || true

      - name: Run E2E suite
        uses: ./.github/actions/run-suite
        with:
          lms_base_url: ${{ inputs.lms_base_url }}
          apps_base_url: ${{ inputs.apps_base_url }}
          cms_base_url: ${{ inputs.cms_base_url }}
          org: ${{ inputs.org }}
          course_key: ${{ inputs.course_key }}
          capabilities: ${{ inputs.capabilities }}
          admin_username: ${{ secrets.ADMIN_USERNAME }}
          admin_password: ${{ secrets.ADMIN_PASSWORD }}
          account_backend: ${{ inputs.account_backend }}
          mail_provider: ${{ inputs.mail_provider != 'none' && inputs.mail_provider || '' }}
          mail_provider_plugins: ${{ inputs.mail_provider == 'openinbox' && './plugins/openinbox.plugin.ts' || '' }}
          openinbox_api_key: ${{ secrets.OPENINBOX_API_KEY }}
          allow_cross_site_origins: ${{ inputs.allow_cross_site_origins }}
          domains: ${{ inputs.domains }}
          features: ${{ inputs.features }}
          exclude_features: ${{ inputs.exclude_features }}
          artifact_suffix: ${{ inputs.environment }}

      # One unsharded run: its single blob report goes through the same merge
      # as a sharded Tutor run, so both produce their reports the same way.
      - name: Report E2E suite
        if: ${{ !cancelled() }}
        uses: ./.github/actions/report-suite
        with:
          blob_dir: blob-report
          lms_base_url: ${{ inputs.lms_base_url }}
          domains: ${{ inputs.domains }}
          artifact_suffix: ${{ inputs.environment }}
          btr_release: ${{ inputs.openedx_release }}
          btr_test_ref: ${{ inputs.test_ref }}
          btr_sheet_url: ${{ steps.btr.outputs.sheet_url }}
          btr_update_latest: ${{ steps.btr.outputs.update_latest }}
          btr_environment: ${{ inputs.environment }}
