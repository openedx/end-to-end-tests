name: ci-tests

# Static checks and the tests that need neither a browser nor a running Open edX
# installation: type-check, lint, formatting, unit tests, and a compile/discovery
# check of every spec. Browser specs (@smoke/@regression) run in a separate
# workflow against a provisioned target.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The steps below use `if: ${{ !cancelled() }}` so a single failure does not
      # hide the other results: every check runs and reports, and the job still
      # fails overall if any of them fail.

      - name: Type-check (tsc --noEmit)
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint (ESLint)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Format check (Prettier)
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Unit & setup projects (no browser or LMS required)
        if: ${{ !cancelled() }}
        run: npx playwright test --project=unit --project=setup

      - name: Verify every spec compiles and is discoverable
        if: ${{ !cancelled() }}
        run: npx playwright test --list

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
