name: ci-tests

# Static checks and the tests that need neither a browser nor a running Open edX
# installation: type-check, lint, formatting, unit tests, and a compile/discovery
# check of every spec, plus two non-blocking Docker (Tutor) jobs that run the
# full suite (minus @unit) against ephemeral "main" and last-release
# installations. Heavier/scheduled regression runs live in separate workflows.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify openedx_release choices match .ci/openedx-releases.json
        run: |
          set -euo pipefail
          WORKFLOW_OPTIONS=$(yq -o=json '.on.workflow_dispatch.inputs.openedx_release.options' .github/workflows/run_tests_tutor.yml | jq -c 'sort')
          RELEASES_JSON_KEYS=$(jq -c 'keys | sort' .ci/openedx-releases.json)
          if [ "$WORKFLOW_OPTIONS" != "$RELEASES_JSON_KEYS" ]; then
            echo "::error::run_tests_tutor.yml's openedx_release choices and .ci/openedx-releases.json have drifted apart."
            echo "  run_tests_tutor.yml options:     $WORKFLOW_OPTIONS"
            echo "  .ci/openedx-releases.json keys: $RELEASES_JSON_KEYS"
            echo "Update whichever one is missing an entry so both list the same releases."
            exit 1
          fi
          echo "OK: both list the same releases ($WORKFLOW_OPTIONS)"

      - name: Configure
        run: cp .env.example .env

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The steps below use `if: ${{ !cancelled() }}` so a single failure does not
      # hide the other results: every check runs and reports, and the job still
      # fails overall if any of them fail.

      - name: Type-check (tsc --noEmit)
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint (ESLint)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Format check (Prettier)
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Unit tests (no browser or LMS required)
        if: ${{ !cancelled() }}
        run: npx playwright test --project=unit

      - name: Verify every spec compiles and is discoverable
        if: ${{ !cancelled() }}
        run: npx playwright test --list

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Non-blocking Docker (Tutor) checks: provision a real Open edX install and
  # run the smoke tests against it.
  docker-main:
    name: 'Docker: main environment'
    uses: ./.github/workflows/run_tests_tutor.yml
    with:
      openedx_release: main
      features: '@smoke'

  docker-last-release:
    name: 'Docker: last release (verawood)'
    uses: ./.github/workflows/run_tests_tutor.yml
    with:
      # Keep in sync with the newest non-"main" entry in .ci/openedx-releases.json.
      openedx_release: verawood
      features: '@smoke'
