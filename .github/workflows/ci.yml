name: ci-tests

# Static checks and the tests that need neither a browser nor a running Open edX
# installation: type-check, lint, formatting, unit tests, and a compile/discovery
# check of every spec, plus three Tutor jobs that run against ephemeral "main",
# last-release and previous-release (ulmo) installations.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Required by the reusable run_tests_tutor.yml, which pulls the prebuilt
  # images (main, and profile image variants) from this repo's ghcr.io namespace.
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify openedx_release choices match .ci/openedx-releases.json
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          WORKFLOW_OPTIONS=$(yq -o=json '.on.workflow_dispatch.inputs.openedx_release.options' .github/workflows/run_tests_tutor.yml | jq -c 'sort')
          RELEASES_JSON_KEYS=$(jq -c 'keys | sort' .ci/openedx-releases.json)
          if [ "$WORKFLOW_OPTIONS" != "$RELEASES_JSON_KEYS" ]; then
            echo "::error::run_tests_tutor.yml's openedx_release choices and .ci/openedx-releases.json have drifted apart."
            echo "  run_tests_tutor.yml options:     $WORKFLOW_OPTIONS"
            echo "  .ci/openedx-releases.json keys: $RELEASES_JSON_KEYS"
            echo "Update whichever one is missing an entry so both list the same releases."
            exit 1
          fi
          echo "OK: both list the same releases ($WORKFLOW_OPTIONS)"

          # Advisory only: a release without a BTR_SHEET_URL_<RELEASE> repository
          # variable runs fine, it just never publishes BTR results.
          for release in $(jq -r 'keys[]' .ci/openedx-releases.json); do
            VAR_NAME="BTR_SHEET_URL_${release^^}"
            if [ -z "$(jq -r --arg k "$VAR_NAME" '.[$k] // empty' <<< "$VARS_JSON")" ]; then
              echo "::warning::No ${VAR_NAME} repository variable: scheduled/manual '${release}' runs will not publish BTR results."
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The steps below use `if: ${{ !cancelled() }}` so a single failure does not
      # hide the other results: every check runs and reports, and the job still
      # fails overall if any of them fail.

      - name: Type-check (tsc --noEmit)
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint (ESLint)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Format check (Prettier)
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Unit tests (no browser or LMS required)
        if: ${{ !cancelled() }}
        # Point at the in-repo examples/ dir so `unit/examples` runs here and the
        # convention scans cover it, exercising CUSTOM_TEST_DIRS on every PR. The
        # glob includes the mirrored external unit projects alongside `unit`.
        env:
          CUSTOM_TEST_DIRS: ./examples
        run: npx playwright test --project='unit*'

      - name: Verify every spec compiles and is discoverable
        if: ${{ !cancelled() }}
        run: npx playwright test --list

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Non-blocking Docker (Tutor) checks: provision a real Open edX install and
  # run the tests against it.
  docker-main:
    name: 'Docker: main environment'
    uses: ./.github/workflows/run_tests_tutor.yml
    with:
      openedx_release: main
      profiles: default extended aspects

  docker-last-release:
    name: 'Docker: last release (verawood)'
    uses: ./.github/workflows/run_tests_tutor.yml
    with:
      # Keep in sync with the newest non-"main" entry in .ci/openedx-releases.json.
      # A profile limited to named releases (`releases` in .ci/profiles.json:
      # `aspects`, its extension's `releases` and `releaseCapabilities`) and the
      # build matrix of build_tutor_main_images.yml name it too; the plan job
      # refuses a profile on a release it does not list.
      openedx_release: verawood
      profiles: default extended aspects

  # The release before the last one. Its capabilities
  # (.ci/openedx-releases.json) declare only what the suite's coverage works
  # against there; docs/capabilities.md lists what is held back and why. No
  # `aspects`: that profile runs on main and verawood only.
  #
  # `allow_failure`: a failing ulmo shard does not fail this workflow. ulmo
  # still has known failures (docs/findings.md), and its report says which.
  docker-ulmo:
    name: 'Docker: previous release (ulmo)'
    uses: ./.github/workflows/run_tests_tutor.yml
    with:
      openedx_release: ulmo
      profiles: default extended
      allow_failure: true
